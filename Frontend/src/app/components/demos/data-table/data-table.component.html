<app-header></app-header>
<section class="mt-3 table-responsive">
  <div class="container-fluid">
    <div class="row">
      <div class="col-xs-12 col-sm-12 col-md-12 col-lg-12">
        <h5>Material Table :</h5>
        <hr>
        <div class="example-header">
          <mat-form-field class="w-25">
            <input matInput (keyup)="applyFilter($event)" placeholder="Filter" >
          </mat-form-field>
          <button class="btn btn-success float-end mt-1" (click)="openDialog('Create', '')"><i class="fa fa-user me-2"></i>Add User</button>
        </div>

        <div class="example-container mat-elevation-z8">

          <mat-table [dataSource]="dataSource" matSort>

            <ng-container matColumnDef="firstName">e
              <mat-header-cell *matHeaderCellDef mat-sort-header> First Name </mat-header-cell>
              <mat-cell *matCellDef="let row"> {{row.firstName}} </mat-cell>
            </ng-container>

            <ng-container matColumnDef="lastName">
              <mat-header-cell *matHeaderCellDef mat-sort-header> Last Name </mat-header-cell>
              <mat-cell *matCellDef="let row"> {{ row.lastName }} </mat-cell>
            </ng-container>

            <ng-container matColumnDef="primaryMobNo">
              <mat-header-cell *matHeaderCellDef> Mobile Number </mat-header-cell>
              <mat-cell *matCellDef="let row"> {{row.primaryMobNo}} </mat-cell>
            </ng-container>

            <ng-container matColumnDef="action">
              <mat-header-cell *matHeaderCellDef> Action </mat-header-cell>
              <mat-cell *matCellDef="let element">
                <button class="btn btn-info btn-sm text-decoration-none me-3" (click)="openDialog('Edit', element)"><i class="fa fa-edit"></i></button> |
                <button class="btn btn-danger btn-sm text-decoration-none ms-3" (click)="deleteRecord(element.id)"><i class="fa fa-remove"></i></button>
              </mat-cell>
            </ng-container>

            <ng-container matColumnDef="edit">
              <mat-header-cell *matHeaderCellDef > Edit </mat-header-cell>
              <mat-cell> <i class="fa fa-edit"></i> </mat-cell>
            </ng-container>

            <ng-container matColumnDef="delete">
              <mat-header-cell *matHeaderCellDef > Delete </mat-header-cell>
              <mat-cell> <i class="fa fa-delete"></i> </mat-cell>
            </ng-container>

            <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
            <mat-row *matRowDef="let row; columns: displayedColumns;">
            </mat-row>

          </mat-table>

          <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]"></mat-paginator>
        </div>
      </div>
    </div>
  </div>
</section>

<ng-container *ngIf="showModal">
  <div class="c-modal position-fixed h-100 w-50 bg-light top-0 end-0 shadow-lg overflow-scroll">
    <i class="c-close fa fa-remove" (click)="closeDialog()"></i>
    <div class="container-fluid">
      <div class="row">
        <div class="col-xs-12 col-sm-12 col-md-12 col-lg-12 p-5 pt-4">
          <h5 *ngIf="buttonStatus.saveButton">Create New Reocrd :</h5>
          <h5 *ngIf="buttonStatus.updateButton">Update Record :</h5>
          <hr>
          <input class="form-control mb-3" type="hidden" [(ngModel)]="user.id" readonly>
          <input class="form-control mb-3" type="text" [(ngModel)]="user.userName" name="userName" placeholder="Username" minlength="3" required>
          <input class="form-control mb-3" type="text" [(ngModel)]="user.password" name="password" placeholder="Password" required>
          <input class="form-control mb-3" type="text" [(ngModel)]="user.firstName" name="firstName" placeholder="First Name" required>
          <input class="form-control mb-3" type="text" [(ngModel)]="user.lastName" name="lastName" placeholder="Last Name" required>
          <input class="form-control mb-3" type="text" [(ngModel)]="user.primaryMobNo" name="primaryMobNo" placeholder="Primary Mobile Number" required>
          <input class="form-control mb-3" type="text" [(ngModel)]="user.secondaryMobNo" name="secondaryMobNo" placeholder="Secondary Mobile Number" required>
          <input class="form-control mb-3" type="text" [(ngModel)]="user.telephoneNo" name="telephoneNo" placeholder="Telephone Number" required>
          <select class="form-control mb-3" [(ngModel)]="user.gender" name="gender" required>
            <option value="-1">-Select Gender-</option>
            <option value="0">Male</option>
            <option value="1">Female</option>
            <option value="2">Other</option>
          </select>
          <button class="form-control btn btn-success" (click)="createRecord(user)" *ngIf="buttonStatus.saveButton">Save</button>
          <button class="form-control btn btn-info" (click)="updateRecord(user)" *ngIf="buttonStatus.updateButton">Update</button>
        </div>
      </div>
    </div>
  </div>
</ng-container>
