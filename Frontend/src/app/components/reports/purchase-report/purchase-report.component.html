          </div>

            <div class="input-group mt-2 mb-2">
              <div class="input-group-text"><i class="c-fa fa fa-calendar"></i> From : </div>
              <input class="form-control" type="date"/>
            </div>
          </div>

              <input class="form-control" type="date"/>
