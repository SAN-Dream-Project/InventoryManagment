<app-header></app-header>
<section class="mt-3 table-responsive">
  <div class="container-fluid">
    <div class="row">
      <div class="col-xs-12 col-sm-12 col-md-12 col-lg-12">
        <h5>Good Purchase Average Rate Details :</h5>
        <hr>
        <table class="table table-striped table-hover">
          <thead class="bg-dark text-white text-start">
          <tr>
            <th class="pt-3 pb-3">Good Name</th>
            <th class="pt-3 pb-3">Good Average Rate</th>
          </tr>
          </thead>
          <tbody>
          <tr *ngFor="let good of goods">
            <td class="align-middle">{{ good.goodName }}</td>
            <td class="align-middle">{{ good.averageRate }}</td>
          </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</section>
<app-footer></app-footer>
